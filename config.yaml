data_dir: data
results_dir: results
models_dir: models
seed: 0

bands: [B02, B03, B04, B05, B06, B07, B08, B8A]
chip: 256
cluster: 4
max_scene_cloud: 10
max_chip_bad: 0.05

classes: [tree, grass_shrub, cropland, built, bare, water]
worldcover_map: {10: 0, 20: 1, 30: 1, 40: 2, 50: 3, 60: 4, 80: 5}

regions:
  iowa_summer: {bbox: [-94.4, 41.7, -93.0, 42.4], dates: 2021-07-01/2021-08-31, clusters: 20, role: source}
  niger_dry: {bbox: [6.8, 13.2, 8.6, 13.9], dates: 2021-01-01/2021-03-31, clusters: 10, role: target}
  senegal_dry: {bbox: [-16.5, 13.8, -15.2, 14.5], dates: 2021-01-01/2021-03-31, clusters: 10, role: target}
  iowa_autumn: {bbox: [-94.4, 41.7, -93.0, 42.4], dates: 2021-10-20/2021-11-30, clusters: 7, role: extra}
  niger_wet: {bbox: [6.8, 13.2, 8.6, 13.9], dates: 2021-09-01/2021-10-20, clusters: 7, role: extra}
n_blocks: 3

demo_scenes:
  demo_mali_dry: [-6.25, 13.45, 2021-01-01/2021-03-31]
  demo_iowa_summer: [-95.3, 42.3, 2021-07-01/2021-08-31]

train: {encoder: resnet18, epochs: 30, batch: 8, lr: 3.0e-4, weight_decay: 1.0e-4}
adapt: {fda_beta: 0.01, ema: 0.999, class_quantile: 0.5, rounds: 2, steps_per_round: 400, lr: 1.0e-4, tent_steps: 200}
label_budgets: [5, 10, 20]
